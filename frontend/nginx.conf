# ------------------------------------------------------------------------------
# Frontend static host.
#
# Two jobs: serve the built SPA with the right caching, and proxy /api to the
# backend so the browser sees one origin. That removes CORS from the picture
# entirely in the containerised stack — the app calls /api/classes and nginx
# forwards it to the API service on the compose network.
# ------------------------------------------------------------------------------

upstream api_upstream {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # Security headers that cost nothing and close obvious holes. The CSP
    # allows inline styles because the theme's design tokens are applied
    # through style attributes by the component library.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # Hashed build output never changes under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Seat counts must never be served from a cache.
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # index.html itself is never cached, so a deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: any unknown path is the app shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
